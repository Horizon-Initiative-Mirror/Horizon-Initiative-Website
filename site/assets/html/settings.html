<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings</title>
    <link href="/assets/css/light1.css" rel="stylesheet" type="text/css" media="all">
    <link href="/assets/css/global.css" rel="stylesheet" type="text/css" media="all">
    <script src="/assets/js/apply.js" defer></script>
  </head>
  <body>
    <h1>Settings</h1>
    <noscript><h1>THIS FEATURE REQUIRES JS. PLEASE ENABLE JS OR UPGRADE TO A BROWSER THAT SUPPORTS IT.</h1></noscript>
    <label for="theme">Theme:</label>
    <select id="theme" name="theme">
        <option value="/assets/css/light1.css">Light (White BG Black FG) (Default)</option>
        <option value="/assets/css/dark1.css">Dark Theme A (Black BG White BG)</option>
        <option value="/assets/css/dark2.css">Dark Theme B (Black BG Grey FG)</option>
    </select>
    <br>
    <p>More Settings Coming Soon!</p>
    <!-- Button to Save Settings -->
    <button id="saveBtn">Save Settings</button>

    <script>
      // @license magnet:?xt=urn:btih:1f739d935676111cfff4b4693e3816e664797050&dn=gpl-3.0.txt GPL-v3-or-Later
        document.getElementById('saveBtn').onclick = function() {
            const userSettings = {
                //test username: document.getElementById('username').value,
                //notifications: document.getElementById('notifications').checked,
                //contact: document.querySelector('input[name="contact"]:checked').value,
                theme: document.getElementById('theme').value
            };
            localStorage.setItem("userSettings",JSON.stringify(userSettings))
            console.log('Saved Settings:', JSON.stringify(userSettings), ' Reloading Page...');
            location.reload()
        };
    // @license-end
    </script>
  </body>
</html>
